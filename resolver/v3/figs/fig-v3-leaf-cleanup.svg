<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1190" viewBox="0 0 1280 1190" font-family="Helvetica, Arial, sans-serif"><rect width="1280" height="1190" fill="#FFFFFF"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#1F2A44"/></marker><marker id="arrO" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#E8731A"/></marker></defs>
<text x="40" y="44" text-anchor="start" font-size="22" font-weight="700" fill="#1F2A44">Clean once, before any task saves a position in the leaf</text>
<text x="40" y="68" text-anchor="start" font-size="15" font-weight="400" fill="#5B6578">Tasks keep leaf positions as ranks. Compacting expired entries changes ranks, so a leaf is compacted on its first visit in a batch and stamped with the batch</text>
<text x="40" y="88" text-anchor="start" font-size="15" font-weight="400" fill="#5B6578">number; later arrivals in the same batch see the stamp and share the same rank mapping. Empty leaves stay linked until every task has finished.</text>
<text x="60" y="128" text-anchor="start" font-size="15" font-weight="700" fill="#1F2A44">1  Three arrivals at the same leaf in batch 42</text>
<text x="480" y="128" text-anchor="start" font-size="13" font-weight="400" fill="#5B6578">reclaimCV = 20: entries with cv ≤ 20 are expired and still physically present</text>
<text x="60" y="168" text-anchor="start" font-size="12.5" font-weight="600" fill="#5B6578">before the first arrival</text>
<rect x="240" y="184" width="468" height="40" rx="5" fill="#EEF1F6" stroke="#1F2A44" stroke-width="1.4"/>
<rect x="241" y="185" width="76" height="38" rx="3" fill="#F9DEDC"/>
<text x="279.0" y="201" text-anchor="middle" font-size="13.5" font-weight="700" fill="#C62828">a</text>
<text x="279.0" y="217" text-anchor="middle" font-size="12.5" font-weight="400" fill="#C62828">cv 12</text>
<line x1="318" y1="184" x2="318" y2="224" stroke="#8A93A6" stroke-width="0.9"/>
<text x="357.0" y="201" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2A44">c</text>
<text x="357.0" y="217" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">cv 40</text>
<line x1="396" y1="184" x2="396" y2="224" stroke="#8A93A6" stroke-width="0.9"/>
<rect x="397" y="185" width="76" height="38" rx="3" fill="#F9DEDC"/>
<text x="435.0" y="201" text-anchor="middle" font-size="13.5" font-weight="700" fill="#C62828">e</text>
<text x="435.0" y="217" text-anchor="middle" font-size="12.5" font-weight="400" fill="#C62828">cv 9</text>
<line x1="474" y1="184" x2="474" y2="224" stroke="#8A93A6" stroke-width="0.9"/>
<text x="513.0" y="201" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2A44">g</text>
<text x="513.0" y="217" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">cv 44</text>
<line x1="552" y1="184" x2="552" y2="224" stroke="#8A93A6" stroke-width="0.9"/>
<text x="591.0" y="201" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2A44">k</text>
<text x="591.0" y="217" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">cv 47</text>
<line x1="630" y1="184" x2="630" y2="224" stroke="#8A93A6" stroke-width="0.9"/>
<text x="669.0" y="208.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#8A93A6">·</text>
<text x="240" y="176" text-anchor="start" font-size="13" font-weight="700" fill="#1F2A44">L</text>
<text x="708" y="176" text-anchor="end" font-size="12.5" font-weight="600" fill="#5B6578">lastCleanReadBatch = 41</text>
<text x="724" y="200" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">ranks 0..4 include two expired entries;</text>
<text x="724" y="218" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">a rank saved now would shift when they go</text>
<rect x="60" y="278" width="370" height="72" rx="7" fill="#FFF1E6" stroke="#E8731A" stroke-width="1.4"/>
<text x="72" y="300" text-anchor="start" font-size="13.5" font-weight="700" fill="#1F2A44">T1 · direct descent</text>
<text x="72" y="320" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">from the parent, after CompareKeys</text>
<text x="72" y="338" text-anchor="start" font-size="12.5" font-weight="600" fill="#E8731A">first to arrive</text>
<rect x="470" y="278" width="370" height="72" rx="7" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.4"/>
<text x="482" y="300" text-anchor="start" font-size="13.5" font-weight="700" fill="#1F2A44">T2 · scan from the left</text>
<text x="482" y="320" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">leafNext from L&#8217;s left neighbor</text>
<text x="482" y="338" text-anchor="start" font-size="12.5" font-weight="600" fill="#5B6578">arrives later</text>
<rect x="880" y="278" width="370" height="72" rx="7" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.4"/>
<text x="892" y="300" text-anchor="start" font-size="13.5" font-weight="700" fill="#1F2A44">T3 · predecessor from the right</text>
<text x="892" y="320" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">leafPrevious from L&#8217;s right neighbor</text>
<text x="892" y="338" text-anchor="start" font-size="12.5" font-weight="600" fill="#5B6578">arrives later</text>
<text x="60" y="376" text-anchor="start" font-size="13" font-weight="600" fill="#E8731A">first arrival: stamp 41 ≠ 42 → cleanReadLeaf: drop a and e, compact ranks, stamp 42, then save a rank</text>
<rect x="240" y="412" width="468" height="40" rx="5" fill="#EEF1F6" stroke="#1F2A44" stroke-width="1.4"/>
<text x="279.0" y="429" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2A44">c</text>
<text x="279.0" y="445" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">cv 40</text>
<line x1="318" y1="412" x2="318" y2="452" stroke="#8A93A6" stroke-width="0.9"/>
<text x="357.0" y="429" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2A44">g</text>
<text x="357.0" y="445" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">cv 44</text>
<line x1="396" y1="412" x2="396" y2="452" stroke="#8A93A6" stroke-width="0.9"/>
<text x="435.0" y="429" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2A44">k</text>
<text x="435.0" y="445" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">cv 47</text>
<line x1="474" y1="412" x2="474" y2="452" stroke="#8A93A6" stroke-width="0.9"/>
<text x="513.0" y="436.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#8A93A6">·</text>
<line x1="552" y1="412" x2="552" y2="452" stroke="#8A93A6" stroke-width="0.9"/>
<text x="591.0" y="436.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#8A93A6">·</text>
<line x1="630" y1="412" x2="630" y2="452" stroke="#8A93A6" stroke-width="0.9"/>
<text x="669.0" y="436.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#8A93A6">·</text>
<text x="240" y="404" text-anchor="start" font-size="13" font-weight="700" fill="#1F2A44">L</text>
<text x="708" y="404" text-anchor="end" font-size="12.5" font-weight="600" fill="#E8731A">lastCleanReadBatch = 42</text>
<text x="724" y="428" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">ranks 0, 1, 2; the same mapping for the rest</text>
<text x="724" y="446" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">of batch 42: no write or reclamation interleaves</text>
<text x="60" y="478" text-anchor="start" font-size="12.5" font-weight="600" fill="#5B6578">positions saved against the cleaned leaf</text>
<text x="80" y="502" text-anchor="start" font-size="13" font-weight="700" fill="#1F2A44">T1</text>
<text x="120" y="502" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">rank 1 (g): first write at or after its read begin; scan starts here</text>
<text x="80" y="522" text-anchor="start" font-size="13" font-weight="700" fill="#1F2A44">T2</text>
<text x="120" y="522" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">rank 0 (c): continues its scan from the first entry; stamp 42 seen, no second compaction</text>
<text x="80" y="542" text-anchor="start" font-size="13" font-weight="700" fill="#1F2A44">T3</text>
<text x="120" y="542" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">prevRank = count = 3, exclusive: the first inspected rank is 2 (k); stamp 42 seen</text>
<text x="60" y="578" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">Had T2 or T3 arrived first, it would have done the compaction; what matters is that it happens once, before any rank is saved, and that every later arrival maps ranks the same way.</text>
<text x="60" y="610" text-anchor="start" font-size="15" font-weight="700" fill="#1F2A44">2  A leaf that becomes empty stays in the chain until traversal ends</text>
<text x="60" y="646" text-anchor="start" font-size="12.5" font-weight="600" fill="#5B6578">during the batch</text>
<rect x="160" y="662" width="234" height="40" rx="5" fill="#EEF1F6" stroke="#1F2A44" stroke-width="1.4"/>
<text x="199.0" y="679" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2A44">m</text>
<text x="199.0" y="695" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">cv 33</text>
<line x1="238" y1="662" x2="238" y2="702" stroke="#8A93A6" stroke-width="0.9"/>
<text x="277.0" y="679" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2A44">n</text>
<text x="277.0" y="695" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">cv 41</text>
<line x1="316" y1="662" x2="316" y2="702" stroke="#8A93A6" stroke-width="0.9"/>
<text x="355.0" y="686.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#8A93A6">·</text>
<text x="160" y="654" text-anchor="start" font-size="13" font-weight="700" fill="#1F2A44">L1</text>
<rect x="460" y="662" width="234" height="40" rx="5" fill="#F3F4F7" stroke="#8A93A6" stroke-width="1.4"/>
<text x="499.0" y="686.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#8A93A6">·</text>
<line x1="538" y1="662" x2="538" y2="702" stroke="#8A93A6" stroke-width="0.9"/>
<text x="577.0" y="686.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#8A93A6">·</text>
<line x1="616" y1="662" x2="616" y2="702" stroke="#8A93A6" stroke-width="0.9"/>
<text x="655.0" y="686.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#8A93A6">·</text>
<text x="460" y="654" text-anchor="start" font-size="13" font-weight="700" fill="#1F2A44">L2  · all entries expired, compacted to empty</text>
<rect x="760" y="662" width="234" height="40" rx="5" fill="#EEF1F6" stroke="#1F2A44" stroke-width="1.4"/>
<text x="799.0" y="679" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2A44">t</text>
<text x="799.0" y="695" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">cv 45</text>
<line x1="838" y1="662" x2="838" y2="702" stroke="#8A93A6" stroke-width="0.9"/>
<text x="877.0" y="679" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2A44">v</text>
<text x="877.0" y="695" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">cv 46</text>
<line x1="916" y1="662" x2="916" y2="702" stroke="#8A93A6" stroke-width="0.9"/>
<text x="955.0" y="686.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#8A93A6">·</text>
<text x="760" y="654" text-anchor="start" font-size="13" font-weight="700" fill="#1F2A44">L3</text>
<line x1="398" y1="682.0" x2="456" y2="682.0" stroke="#1F2A44" stroke-width="1.3" stroke-dasharray="2 4"/>
<line x1="698" y1="682.0" x2="756" y2="682.0" stroke="#1F2A44" stroke-width="1.3" stroke-dasharray="2 4"/>
<text x="1010" y="680" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">leafPrevious / leafNext kept:</text>
<text x="1010" y="698" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">T3-style predecessor searches and scans</text>
<text x="1010" y="716" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">still pass through L2</text>
<text x="60" y="756" text-anchor="start" font-size="12.5" font-weight="600" fill="#5B6578">cleanup queue</text>
<rect x="180" y="740" width="300" height="26" rx="5" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.2"/>
<text x="330" y="758" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1F2A44">(L2 pointer, node generation 17)</text>
<rect x="500" y="740" width="300" height="26" rx="5" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.2"/>
<text x="650" y="758" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1F2A44">(L2 pointer, node generation 17)</text>
<text x="820" y="758" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">two tasks met L2 and both queued it: duplicates are allowed</text>
<text x="60" y="792" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">An empty leaf is not released while tasks run: a task may hold a rank in it, a parent bound above it, or be about to arrive from a neighbor. Releasing it now would</text>
<text x="60" y="810" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">break saved positions and the chain; cleanPending runs only when resident, new and suspended tasks are all finished.</text>
<text x="60" y="840" text-anchor="start" font-size="12.5" font-weight="600" fill="#5B6578">after traversal: cleanPending drains the queue, allocating nothing</text>
<rect x="80" y="856" width="1140" height="42" rx="6" fill="#E6F2E7" stroke="#2E7D32" stroke-width="1.2"/>
<text x="94" y="874" text-anchor="start" font-size="13" font-weight="700" fill="#1F2A44">record 1</text>
<text x="94" y="891" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">generation 17 matches L2&#8217;s</text>
<text x="330" y="883" text-anchor="start" font-size="12.5" font-weight="400" fill="#1F2A44">unlink L2 from the chain, remove its entry from the parent, release the block: its node generation is cleared</text>
<rect x="80" y="910" width="1140" height="42" rx="6" fill="#F3F4F7" stroke="#8A93A6" stroke-width="1.2"/>
<text x="94" y="928" text-anchor="start" font-size="13" font-weight="700" fill="#1F2A44">record 2</text>
<text x="94" y="945" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">generation 17 ≠ cleared</text>
<text x="330" y="937" text-anchor="start" font-size="12.5" font-weight="400" fill="#1F2A44">skipped: the node it named is gone, and its block may already be in the free list</text>
<rect x="160" y="990" width="234" height="40" rx="5" fill="#EEF1F6" stroke="#1F2A44" stroke-width="1.4"/>
<text x="199.0" y="1007" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2A44">m</text>
<text x="199.0" y="1023" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">cv 33</text>
<line x1="238" y1="990" x2="238" y2="1030" stroke="#8A93A6" stroke-width="0.9"/>
<text x="277.0" y="1007" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2A44">n</text>
<text x="277.0" y="1023" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">cv 41</text>
<line x1="316" y1="990" x2="316" y2="1030" stroke="#8A93A6" stroke-width="0.9"/>
<text x="355.0" y="1014.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#8A93A6">·</text>
<text x="160" y="982" text-anchor="start" font-size="13" font-weight="700" fill="#1F2A44">L1</text>
<rect x="460" y="990" width="234" height="40" rx="5" fill="#EEF1F6" stroke="#1F2A44" stroke-width="1.4"/>
<text x="499.0" y="1007" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2A44">t</text>
<text x="499.0" y="1023" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">cv 45</text>
<line x1="538" y1="990" x2="538" y2="1030" stroke="#8A93A6" stroke-width="0.9"/>
<text x="577.0" y="1007" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F2A44">v</text>
<text x="577.0" y="1023" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">cv 46</text>
<line x1="616" y1="990" x2="616" y2="1030" stroke="#8A93A6" stroke-width="0.9"/>
<text x="655.0" y="1014.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#8A93A6">·</text>
<text x="460" y="982" text-anchor="start" font-size="13" font-weight="700" fill="#1F2A44">L3</text>
<line x1="398" y1="1010.0" x2="456" y2="1010.0" stroke="#1F2A44" stroke-width="1.3" stroke-dasharray="2 4"/>
<text x="760" y="1000" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">L1 and L3 are now neighbors; empty ancestors are removed the same way</text>
<text x="760" y="1018" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">and the root is normalized. Nothing is allocated during the drain, so a</text>
<text x="760" y="1036" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">released block is not reused before the queue is empty.</text>
<rect x="60" y="1065" width="1160" height="108" rx="8" fill="#F8F9FB" stroke="#E8731A" stroke-width="1.4"/>
<text x="78" y="1089" text-anchor="start" font-size="14" font-weight="700" fill="#1F2A44">Why the stamp, and why the queue</text>
<text x="78" y="1111" text-anchor="start" font-size="13" font-weight="400" fill="#5B6578">Ranks are positions in order[] after compaction; two tasks that saw different compactions of the same leaf would disagree about which entry a rank names.</text>
<text x="78" y="1130" text-anchor="start" font-size="13" font-weight="400" fill="#5B6578">The stamp makes the first visit of a batch the only one that compacts, and the fixed cutoff plus the absence of writes keeps the cleaned ranks stable afterwards.</text>
<text x="78" y="1149" text-anchor="start" font-size="13" font-weight="400" fill="#5B6578">Structural release is deferred for the same reason: saved ranks, parent bounds and leaf links must outlive every task that may use them.</text>
</svg>
