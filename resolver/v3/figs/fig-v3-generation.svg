<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="800" fill="#fff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#5b6578"/></marker>
  </defs>
  <text x="42" y="52" font-size="27" font-weight="700" fill="#1f2a44">One pool, two disjoint generation spaces</text>
  <text x="42" y="82" font-size="16" fill="#5b6578">A physical block may cross roles after release; its generation value cannot be mistaken for the former role.</text>
  <rect x="55" y="135" width="330" height="210" rx="12" fill="#f7f8fa" stroke="#2e60aa" stroke-width="3"/>
  <rect x="55" y="135" width="330" height="55" rx="12" fill="#2e60aa"/><rect x="55" y="175" width="330" height="15" fill="#2e60aa"/>
  <text x="78" y="170" font-size="20" font-weight="700" fill="#fff">Node block</text>
  <text x="78" y="225" font-size="17" font-weight="700" fill="#1f2a44">Odd generations: 1, 3, 5, …</text>
  <text x="78" y="260" font-size="15" fill="#5b6578">Deferred cleanup stores:</text>
  <text x="78" y="285" font-size="15" fill="#1f2a44">(node address, node generation)</text>
  <text x="78" y="320" font-size="15" fill="#5b6578">A mismatch skips the stale record.</text>
  <rect x="475" y="135" width="330" height="210" rx="12" fill="#f7f8fa" stroke="#657187" stroke-width="3"/>
  <rect x="475" y="135" width="330" height="55" rx="12" fill="#657187"/><rect x="475" y="175" width="330" height="15" fill="#657187"/>
  <text x="498" y="170" font-size="20" font-weight="700" fill="#fff">Shared free block</text>
  <text x="498" y="225" font-size="16" fill="#1f2a44">Release clears the old header.</text>
  <text x="498" y="255" font-size="16" fill="#1f2a44">The same address returns to the pool.</text>
  <text x="498" y="285" font-size="16" fill="#1f2a44">Its next allocation may have</text>
  <text x="498" y="315" font-size="16" fill="#1f2a44">the other role.</text>
  <rect x="895" y="135" width="330" height="210" rx="12" fill="#f7f8fa" stroke="#e8731a" stroke-width="3"/>
  <rect x="895" y="135" width="330" height="55" rx="12" fill="#e8731a"/><rect x="895" y="175" width="330" height="15" fill="#e8731a"/>
  <text x="918" y="170" font-size="20" font-weight="700" fill="#fff">Key block</text>
  <text x="918" y="225" font-size="17" font-weight="700" fill="#1f2a44">Even generations: 2, 4, 6, …</text>
  <text x="918" y="260" font-size="15" fill="#5b6578">RangeRef stores address, offset,</text>
  <text x="918" y="285" font-size="15" fill="#5b6578">lengths and first-block generation.</text>
  <text x="918" y="320" font-size="15" fill="#5b6578">Reclamation advances an even boundary.</text>
  <line x1="395" y1="240" x2="460" y2="240" stroke="#5b6578" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="815" y1="240" x2="880" y2="240" stroke="#5b6578" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="410" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2a44">Validation never relies on the address alone</text>
  <rect x="55" y="455" width="565" height="220" rx="12" fill="#f7f8fa" stroke="#2e7d32" stroke-width="3"/>
  <text x="80" y="493" font-size="19" font-weight="700" fill="#2e7d32">Logical and key-reference checks</text>
  <text x="80" y="535" font-size="16" fill="#1f2a44">1. Compare the entry commit version with the cutoff.</text>
  <text x="80" y="570" font-size="16" fill="#1f2a44">2. Compare RangeRef generation with the last reclaimed</text>
  <text x="102" y="595" font-size="16" fill="#1f2a44">key generation before reading key bytes.</text>
  <text x="80" y="637" font-size="15" font-weight="700" fill="#2e7d32">A stale reference is rejected without dereferencing its block.</text>
  <rect x="660" y="455" width="565" height="220" rx="12" fill="#f7f8fa" stroke="#2e60aa" stroke-width="3"/>
  <text x="685" y="493" font-size="19" font-weight="700" fill="#2e60aa">Node and cross-role checks</text>
  <text x="685" y="535" font-size="16" fill="#1f2a44">A deferred node record is accepted only while its saved</text>
  <text x="685" y="560" font-size="16" fill="#1f2a44">odd generation still matches. If that address now holds keys,</text>
  <text x="685" y="585" font-size="16" fill="#1f2a44">its even generation cannot equal the saved node generation.</text>
  <text x="685" y="627" font-size="15" font-weight="700" fill="#2e60aa">Cross-role reuse therefore cannot revive an old reference.</text>
  <rect x="55" y="715" width="1170" height="58" rx="10" fill="#fff7ed" stroke="#e8731a" stroke-width="2"/>
  <text x="80" y="751" font-size="17" font-weight="700" fill="#e8731a">Final-v3 invariant:</text>
  <text x="245" y="751" font-size="17" fill="#1f2a44">node generations are odd and key-block generations are even.</text>
</svg>
