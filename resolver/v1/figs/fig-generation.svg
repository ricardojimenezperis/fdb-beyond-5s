<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830" font-family="Helvetica, Arial, sans-serif"><rect width="1280" height="830" fill="#FFFFFF"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#1F2A44"/></marker><marker id="arrO" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#E8731A"/></marker></defs>
<text x="40" y="44" text-anchor="start" font-size="22" font-weight="700" fill="#1F2A44">Is this reference still valid? One compare, no dereference</text>
<text x="40" y="68" text-anchor="start" font-size="15" font-weight="400" fill="#5B6578">Every key block gets a generation number when allocated, and key blocks are released in allocation order. The tree remembers only the generation of the last</text>
<text x="40" y="88" text-anchor="start" font-size="15" font-weight="400" fill="#5B6578">block it released, lastReclaimedKeyGeneration. A KeyRef carries the generation of its first block: it is valid exactly when that generation is greater.</text>
<text x="60" y="132" text-anchor="start" font-size="15" font-weight="700" fill="#1F2A44">Before reclamation</text>
<text x="260" y="132" text-anchor="start" font-size="13" font-weight="400" fill="#5B6578">keyBlocks in allocation order; the pool blocks they occupy are named in grey</text>
<rect x="120" y="150" width="150" height="56" rx="6" fill="#FDE6D3" stroke="#E8731A" stroke-width="1.5"/>
<text x="195.0" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A44">K  gen 7</text>
<text x="195.0" y="192" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">generation 7</text>
<text x="195.0" y="222" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5B6578">pool block 5 · oldestKeyBlock</text>
<rect x="300" y="150" width="150" height="56" rx="6" fill="#FDE6D3" stroke="#E8731A" stroke-width="1.5"/>
<text x="375.0" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A44">K  gen 8</text>
<text x="375.0" y="192" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">generation 8</text>
<text x="375.0" y="222" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5B6578">pool block 9</text>
<rect x="480" y="150" width="150" height="56" rx="6" fill="#FDE6D3" stroke="#E8731A" stroke-width="1.5"/>
<text x="555.0" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A44">K  gen 9</text>
<text x="555.0" y="192" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">generation 9</text>
<text x="555.0" y="222" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5B6578">pool block 2</text>
<rect x="660" y="150" width="150" height="56" rx="6" fill="#FDE6D3" stroke="#E8731A" stroke-width="1.5"/>
<text x="735.0" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A44">K  gen 10</text>
<text x="735.0" y="192" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">generation 10</text>
<text x="735.0" y="222" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5B6578">pool block 14 · openKeyBlock</text>
<line x1="273" y1="178.0" x2="297" y2="178.0" stroke="#E8731A" stroke-width="1.4" marker-end="url(#arrO)"/>
<line x1="453" y1="178.0" x2="477" y2="178.0" stroke="#E8731A" stroke-width="1.4" marker-end="url(#arrO)"/>
<line x1="633" y1="178.0" x2="657" y2="178.0" stroke="#E8731A" stroke-width="1.4" marker-end="url(#arrO)"/>
<rect x="1040" y="150" width="190" height="56" rx="6" fill="#F8F9FB" stroke="#1F2A44" stroke-width="1.2"/>
<text x="1135" y="172" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6578">lastReclaimedKeyGeneration</text>
<text x="1135" y="192" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2A44">6</text>
<text x="60" y="282" text-anchor="start" font-size="15" font-weight="700" fill="#1F2A44">After reclaiming the two oldest key blocks</text>
<text x="470" y="282" text-anchor="start" font-size="13" font-weight="400" fill="#5B6578">gen 7 and gen 8 went back to freeBlocks and were handed out again. The reclamation boundary advanced from generation 6 to generation 8.</text>
<rect x="120" y="300" width="150" height="56" rx="6" fill="#D7DEEA" stroke="#1F2A44" stroke-width="1.5"/>
<text x="195.0" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A44">B+ node</text>
<text x="195.0" y="342" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578"></text>
<text x="195.0" y="372" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5B6578">pool block 5, now a leaf</text>
<rect x="300" y="300" width="150" height="56" rx="6" fill="#FDE6D3" stroke="#E8731A" stroke-width="1.5"/>
<text x="375.0" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A44">K  gen 9</text>
<text x="375.0" y="342" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">generation 9</text>
<text x="375.0" y="372" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5B6578">pool block 2 · oldestKeyBlock</text>
<rect x="480" y="300" width="150" height="56" rx="6" fill="#FDE6D3" stroke="#E8731A" stroke-width="1.5"/>
<text x="555.0" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A44">K  gen 10</text>
<text x="555.0" y="342" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">generation 10</text>
<text x="555.0" y="372" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5B6578">pool block 14</text>
<rect x="660" y="300" width="150" height="56" rx="6" fill="#FDE6D3" stroke="#E8731A" stroke-width="1.5"/>
<text x="735.0" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A44">K  gen 11</text>
<text x="735.0" y="342" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6578">generation 11</text>
<text x="735.0" y="372" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5B6578">pool block 9 · openKeyBlock</text>
<line x1="453" y1="328.0" x2="477" y2="328.0" stroke="#E8731A" stroke-width="1.4" marker-end="url(#arrO)"/>
<line x1="633" y1="328.0" x2="657" y2="328.0" stroke="#E8731A" stroke-width="1.4" marker-end="url(#arrO)"/>
<rect x="1040" y="300" width="190" height="56" rx="6" fill="#FDE6D3" stroke="#E8731A" stroke-width="1.4"/>
<text x="1135" y="322" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6578">lastReclaimedKeyGeneration</text>
<text x="1135" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#E8731A">8</text>
<text x="1135" y="372" text-anchor="middle" font-size="11" font-weight="400" fill="#5B6578">= generation of the last block released</text>
<text x="60" y="452" text-anchor="start" font-size="15" font-weight="700" fill="#1F2A44">Three stored references</text>
<rect x="80" y="470" width="330" height="96" rx="8" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.3"/>
<text x="94" y="492" text-anchor="start" font-size="13.5" font-weight="700" fill="#1F2A44">RangeRef in a stale leaf entry</text>
<text x="94" y="512" text-anchor="start" font-size="12" font-weight="400" fill="#5B6578">block 5 · offset 212 · len 16 · gen 7</text>
<rect x="94" y="524" width="302" height="30" rx="5" fill="#F9DEDC" stroke="#C62828" stroke-width="1.2"/>
<text x="108" y="544" text-anchor="start" font-size="13" font-weight="700" fill="#C62828">7 ≤ 8  →  invalid</text>
<text x="245.0" y="584" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6578">never dereferenced: block 5 now holds a leaf</text>
<rect x="475" y="470" width="330" height="96" rx="8" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.3"/>
<text x="489" y="492" text-anchor="start" font-size="13.5" font-weight="700" fill="#1F2A44">KeyRef in a live separator</text>
<text x="489" y="512" text-anchor="start" font-size="12" font-weight="400" fill="#5B6578">block 2 · offset 40 · len 12 · gen 9</text>
<rect x="489" y="524" width="302" height="30" rx="5" fill="#E6F2E7" stroke="#2E7D32" stroke-width="1.2"/>
<text x="503" y="544" text-anchor="start" font-size="13" font-weight="700" fill="#2E7D32">9 > 8  →  valid</text>
<text x="640.0" y="584" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6578">bytes are read only after this test passes</text>
<rect x="870" y="470" width="330" height="96" rx="8" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.3"/>
<text x="884" y="492" text-anchor="start" font-size="13.5" font-weight="700" fill="#1F2A44">KeyRef written moments ago</text>
<text x="884" y="512" text-anchor="start" font-size="12" font-weight="400" fill="#5B6578">block 9 · offset sizeof(KeyBlockHeader) · len 20 · gen 11</text>
<rect x="884" y="524" width="302" height="30" rx="5" fill="#E6F2E7" stroke="#2E7D32" stroke-width="1.2"/>
<text x="898" y="544" text-anchor="start" font-size="13" font-weight="700" fill="#2E7D32">11 > 8  →  valid</text>
<text x="1035.0" y="584" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6578">same pool block as a gen-8 ref would name; the generation tells them apart</text>
<path d="M360,470 C360,430 195.0,416 195.0,380" fill="none" stroke="#C62828" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<path d="M755,470 C755,430 375.0,416 375.0,380" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M1150,470 C1150,430 735.0,416 735.0,380" fill="none" stroke="#2E7D32" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="60" y="640" width="1160" height="120" rx="8" fill="#F8F9FB" stroke="#E8731A" stroke-width="1.4"/>
<text x="78" y="664" text-anchor="start" font-size="14" font-weight="700" fill="#1F2A44">Why this is cheap and why it is correct</text>
<text x="78" y="686" text-anchor="start" font-size="13" font-weight="400" fill="#5B6578">Cheap: validity is one integer compare against a single counter. Nothing in the referenced block is read, so a block that now holds a node, or a</text>
<text x="78" y="705" text-anchor="start" font-size="13" font-weight="400" fill="#5B6578">newer key block, is never interpreted as the old key. Stale descriptors may sit in nodes until a search meets them; they are then removed or refreshed (§7).</text>
<text x="78" y="724" text-anchor="start" font-size="13" font-weight="400" fill="#5B6578">Correct: because key blocks are released in allocation order, every block with generation ≤ lastReclaimedKeyGeneration is gone and every block above it is</text>
<text x="78" y="743" text-anchor="start" font-size="13" font-weight="400" fill="#5B6578">live. A record that continues into later blocks is valid while its first block is, since those later blocks cannot have been released before it.</text>
<text x="60" y="800" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B6578">Empty KeyRef values are treated as valid by definition.</text>
</svg>