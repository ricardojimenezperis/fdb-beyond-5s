<text x="366" y="654" text-anchor="start" font-size="15.5" font-weight="700" fill="#2E7D32">v2, from memory</text>
<rect x="14" y="664" width="592" height="1" fill="#C9CFDA"/>
<text x="14" y="684" text-anchor="start" font-size="15.5" font-weight="700" fill="#1F2A44">50</text>
<text x="132" y="684" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">two steps: 35 ≤ 50</text>
<text x="366" y="684" text-anchor="start" font-size="15.5" font-weight="700" fill="#E8731A">v1, one 8 KiB block read</text>
<rect x="14" y="694" width="592" height="1" fill="#C9CFDA"/>
<text x="14" y="714" text-anchor="start" font-size="15.5" font-weight="700" fill="#1F2A44">20</text>
<text x="132" y="714" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">chain ends above 20</text>
<text x="366" y="714" text-anchor="start" font-size="15.5" font-weight="700" fill="#5B6578">key absent at 20</text>
<rect x="14" y="724" width="592" height="1" fill="#C9CFDA"/>
<text x="14" y="744" text-anchor="start" font-size="15.5" font-weight="700" fill="#1F2A44">below floor</text>
<text x="132" y="744" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">rejected before the read</text>
<text x="366" y="744" text-anchor="start" font-size="15.5" font-weight="700" fill="#C62828">transaction_too_old</text>
<text x="14" y="788" text-anchor="start" font-size="16.6" font-weight="400" fill="#5B6578">The floor is the shard's oldestAvailableRV. A read of the latest</text>
<text x="14" y="810" text-anchor="start" font-size="16.6" font-weight="400" fill="#5B6578">value touches only the current row and decodes its prefix.</text>
