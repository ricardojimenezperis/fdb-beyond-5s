<text x="194" y="422" text-anchor="start" font-size="14" font-weight="400" fill="#5B6578">immutable once on disk</text>
<line x1="142.0" y1="272" x2="142.0" y2="362" stroke="#E8731A" stroke-width="1.6" marker-end="url(#arrO)"/>
<text x="14" y="462" text-anchor="start" font-size="16.6" font-weight="400" fill="#5B6578">CV is the commit version at which that value became current. A</text>
<text x="14" y="484" text-anchor="start" font-size="16.6" font-weight="400" fill="#5B6578">record stores no end version: its upper bound is the commit version</text>
<text x="14" y="506" text-anchor="start" font-size="16.6" font-weight="400" fill="#5B6578">of its successor in the chain.</text>
