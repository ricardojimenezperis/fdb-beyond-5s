<text x="132" y="624" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">current row: 120 ≤ 130</text>
<text x="366" y="624" text-anchor="start" font-size="15.5" font-weight="700" fill="#2E7D32">v3, no history access</text>
