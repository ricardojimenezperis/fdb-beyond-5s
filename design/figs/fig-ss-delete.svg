<text x="14" y="24" text-anchor="start" font-size="19" font-weight="700" fill="#E8731A">1</text>
<text x="36" y="24" text-anchor="start" font-size="18" font-weight="700" fill="#1F2A44">A delete is a version; a later write keeps the chain</text>
