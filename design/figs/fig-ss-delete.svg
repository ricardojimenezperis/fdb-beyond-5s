<text x="104.0" y="588" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2A44">value of a</text>
<text x="104.0" y="606" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5B6578">visible in [20, 80)</text>
<rect x="220.0" y="568" width="180" height="46" rx="6" fill="#EEF1F6" stroke="#8A93A6" stroke-width="1.3"/>
<line x1="310.0" y1="509" x2="310.0" y2="566" stroke="#E8731A" stroke-width="1.6" marker-end="url(#arrO)"/>
<text x="310.0" y="588" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2A44">value of b</text>
<text x="310.0" y="606" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5B6578">visible in [55, 80)</text>
<rect x="426.0" y="568" width="180" height="46" rx="6" fill="#EEF1F6" stroke="#8A93A6" stroke-width="1.3"/>
<line x1="516.0" y1="509" x2="516.0" y2="566" stroke="#E8731A" stroke-width="1.6" marker-end="url(#arrO)"/>
<text x="516.0" y="588" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2A44">value of c</text>
<text x="516.0" y="606" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5B6578">visible in [61, 80)</text>
<text x="20" y="638" text-anchor="start" font-size="14" font-weight="400" fill="#5B6578">history page, records appended consecutively</text>
<text x="600" y="638" text-anchor="end" font-size="14" font-weight="700" fill="#E8731A">maxCommitVersion = 80</text>
<text x="14" y="682" text-anchor="start" font-size="16.6" font-weight="400" fill="#5B6578">N cleared keys become N tombstones with N links, the same as</text>
<text x="14" y="704" text-anchor="start" font-size="16.6" font-weight="400" fill="#5B6578">N point deletes sharing one commit version. A range marker could</text>
<text x="14" y="726" text-anchor="start" font-size="16.6" font-weight="400" fill="#5B6578">share the clear version, but it cannot replace the mapping from</text>
<text x="14" y="748" text-anchor="start" font-size="16.6" font-weight="400" fill="#5B6578">each key to its previous version.</text>
<rect x="14" y="770" width="592" height="118" rx="7" fill="#F8F9FB" stroke="#E8731A" stroke-width="1.5"/>
<text x="26" y="796" text-anchor="start" font-size="16.5" font-weight="700" fill="#1F2A44">When tombstones go away</text>
<text x="26" y="820" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">Lazily, once commitVersion ≤ the oldest read version the shard</text>
<text x="26" y="841" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">accepts: the key is then simply absent. A bounded background</text>
<text x="26" y="862" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">scan keeps cold rows from holding tombstones forever.</text>
