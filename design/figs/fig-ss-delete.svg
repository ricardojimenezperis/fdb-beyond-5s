<text x="14" y="110" text-anchor="start" font-size="1" font-weight="400" fill="#5B6578"></text>
<text x="14" y="300" text-anchor="start" font-size="16.6" font-weight="400" fill="#5B6578">The current store holds one head per key: a value or a tombstone.</text>
<text x="14" y="322" text-anchor="start" font-size="16.6" font-weight="400" fill="#5B6578">The tombstone anchors the old chain while a read can still need it,</text>
<text x="14" y="344" text-anchor="start" font-size="16.6" font-weight="400" fill="#5B6578">and moves to history like any value when the key is written again.</text>
<text x="14" y="366" text-anchor="start" font-size="16.6" font-weight="400" fill="#5B6578">A read at 80 meets it and returns absence, with no special case.</text>
<rect x="14" y="390" width="592" height="1" fill="#8A93A6"/>
<text x="14" y="426" text-anchor="start" font-size="19" font-weight="700" fill="#E8731A">2</text>
<text x="36" y="426" text-anchor="start" font-size="18" font-weight="700" fill="#1F2A44">clearRange([a, d)) at version 80</text>
<text x="14" y="452" text-anchor="start" font-size="14.5" font-weight="700" fill="#1F2A44">current store</text>
<rect x="14.0" y="462" width="180" height="46" rx="6" fill="#F9DEDC" stroke="#C62828" stroke-width="2"/>
<text x="104.0" y="482" text-anchor="middle" font-size="15" font-weight="700" fill="#C62828">a: tombstone</text>
<text x="104.0" y="500" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5B6578">current, CV 80</text>
<rect x="220.0" y="462" width="180" height="46" rx="6" fill="#F9DEDC" stroke="#C62828" stroke-width="2"/>
<text x="310.0" y="482" text-anchor="middle" font-size="15" font-weight="700" fill="#C62828">b: tombstone</text>
<text x="310.0" y="500" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5B6578">current, CV 80</text>
<rect x="426.0" y="462" width="180" height="46" rx="6" fill="#F9DEDC" stroke="#C62828" stroke-width="2"/>
<text x="516.0" y="482" text-anchor="middle" font-size="15" font-weight="700" fill="#C62828">c: tombstone</text>
<text x="516.0" y="500" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5B6578">current, CV 80</text>
