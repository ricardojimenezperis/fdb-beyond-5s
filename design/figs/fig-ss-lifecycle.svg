<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1196" viewBox="0 0 620 1196" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="620" height="1196" fill="#FFFFFF"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#1F2A44"/></marker><marker id="arrO" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#E8731A"/></marker><marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#C62828"/></marker><marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#2E7D32"/></marker><marker id="arrU" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#2F5EA8"/></marker><marker id="arrY" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#8A93A6"/></marker></defs>
<text x="14" y="24" text-anchor="start" font-size="19" font-weight="700" fill="#E8731A">1</text>
<text x="36" y="24" text-anchor="start" font-size="18" font-weight="700" fill="#1F2A44">Life of a history page</text>
<rect x="14" y="42" width="170" height="36" rx="6" fill="#EEF1F6" stroke="#1F2A44" stroke-width="1.5"/>
<text x="99" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2A44">WritableResident</text>
<text x="198" y="66" text-anchor="start" font-size="15" font-weight="400" fill="#5B6578">accepts appended small records</text>
<line x1="99" y1="79" x2="99" y2="93" stroke="#1F2A44" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="14" y="94" width="170" height="36" rx="6" fill="#FDE6D3" stroke="#E8731A" stroke-width="1.5"/>
<text x="99" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#E8731A">Spilling</text>
<text x="198" y="118" text-anchor="start" font-size="15" font-weight="400" fill="#5B6578">still readable from memory until the write completes</text>
<line x1="99" y1="131" x2="99" y2="145" stroke="#1F2A44" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="14" y="146" width="170" height="36" rx="6" fill="#ECEDF0" stroke="#8A93A6" stroke-width="1.5"/>
<text x="99" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2A44">Spilled</text>
<text x="198" y="170" text-anchor="start" font-size="15" font-weight="400" fill="#5B6578">immutable on disk; references unchanged</text>
<line x1="99" y1="183" x2="99" y2="197" stroke="#1F2A44" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="14" y="198" width="170" height="36" rx="6" fill="#FFFFFF" stroke="#8A93A6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="99" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2A44">Retiring</text>
<text x="198" y="222" text-anchor="start" font-size="15" font-weight="400" fill="#5B6578">unlinked; waits for pinned readers and pending I/O</text>
<line x1="99" y1="235" x2="99" y2="249" stroke="#1F2A44" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="14" y="250" width="170" height="36" rx="6" fill="#E3F1E4" stroke="#2E7D32" stroke-width="1.5"/>
<text x="99" y="274" text-anchor="middle" font-size="15" font-weight="700" fill="#2E7D32">blocks reusable</text>
<text x="198" y="274" text-anchor="start" font-size="15" font-weight="400" fill="#5B6578">slots return to the free list with a new generation</text>
<text x="14" y="314" text-anchor="start" font-size="16.6" font-weight="400" fill="#5B6578">There is no sealed state: a page below minRV retires from any</text>
<text x="14" y="336" text-anchor="start" font-size="16.6" font-weight="400" fill="#5B6578">state, full or partial, resident or spilled.</text>
<rect x="14" y="360" width="592" height="1" fill="#8A93A6"/>
<text x="14" y="396" text-anchor="start" font-size="19" font-weight="700" fill="#E8731A">2</text>
<text x="36" y="396" text-anchor="start" font-size="18" font-weight="700" fill="#1F2A44">minRV advances: whole pages are reclaimed</text>
<text x="14" y="424" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">Each page keeps one number, maxCommitVersion: the version of</text>
<text x="14" y="446" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">the latest mutation that moved a value into it.</text>
<line x1="24" y1="560" x2="596" y2="560" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="64.26666666666667" y="498" width="72" height="40" rx="5" fill="#FFFFFF" stroke="#8A93A6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="100.26666666666667" y="515" text-anchor="middle" font-size="14" font-weight="700" fill="#8A93A6">P1</text>
<text x="100.26666666666667" y="532" text-anchor="middle" font-size="13.5" font-weight="400" fill="#8A93A6">max 310</text>
<line x1="100.26666666666667" y1="538" x2="100.26666666666667" y2="565" stroke="#8A93A6" stroke-width="1"/>
<rect x="178.66666666666666" y="498" width="72" height="40" rx="5" fill="#FFFFFF" stroke="#8A93A6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="214.66666666666666" y="515" text-anchor="middle" font-size="14" font-weight="700" fill="#8A93A6">P2</text>
<text x="214.66666666666666" y="532" text-anchor="middle" font-size="13.5" font-weight="400" fill="#8A93A6">max 340</text>
<line x1="214.66666666666666" y1="538" x2="214.66666666666666" y2="565" stroke="#8A93A6" stroke-width="1"/>
<rect x="274.0" y="498" width="72" height="40" rx="5" fill="#FFFFFF" stroke="#8A93A6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="310.0" y="515" text-anchor="middle" font-size="14" font-weight="700" fill="#8A93A6">P3</text>
<text x="310.0" y="532" text-anchor="middle" font-size="13.5" font-weight="400" fill="#8A93A6">max 365</text>
<line x1="310.0" y1="538" x2="310.0" y2="565" stroke="#8A93A6" stroke-width="1"/>
<rect x="388.4" y="498" width="72" height="40" rx="5" fill="#EEF1F6" stroke="#1F2A44" stroke-width="1.5"/>
<text x="424.4" y="515" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A44">P4</text>
<text x="424.4" y="532" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5B6578">max 395</text>
<line x1="424.4" y1="538" x2="424.4" y2="565" stroke="#8A93A6" stroke-width="1"/>
<rect x="502.79999999999995" y="498" width="72" height="40" rx="5" fill="#EEF1F6" stroke="#1F2A44" stroke-width="1.5"/>
<text x="538.8" y="515" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A44">P5</text>
<text x="538.8" y="532" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5B6578">max 425</text>
<line x1="538.8" y1="538" x2="538.8" y2="565" stroke="#8A93A6" stroke-width="1"/>
<line x1="367.2" y1="482" x2="367.2" y2="570" stroke="#E8731A" stroke-width="2.2"/>
<text x="367.2" y="588" text-anchor="middle" font-size="15" font-weight="700" fill="#E8731A">minRV = 380</text>
<text x="24" y="588" text-anchor="start" font-size="14" font-weight="400" fill="#5B6578">commit versions →</text>
<text x="14" y="622" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">P1, P2 and P3 satisfy maxCommitVersion &lt; minRV and are retired</text>
<text x="14" y="644" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">whole. No record is visited and no incoming reference is repaired:</text>
<text x="14" y="666" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">accepted reads never follow them. P5 is still writable.</text>
<rect x="14" y="688" width="592" height="116" rx="7" fill="#F8F9FB" stroke="#E8731A" stroke-width="1.5"/>
<text x="26" y="714" text-anchor="start" font-size="16.5" font-weight="700" fill="#1F2A44">Why the page number is not the record's own version</text>
<text x="26" y="738" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">A value committed at 10 and replaced at 100 has record</text>
<text x="26" y="759" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">commitVersion 10, but its page gets maxCommitVersion ≥ 100:</text>
<text x="26" y="780" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">a read at 50 still needs it.</text>
<rect x="14" y="822" width="592" height="1" fill="#8A93A6"/>
<text x="14" y="858" text-anchor="start" font-size="19" font-weight="700" fill="#E8731A">3</text>
<text x="36" y="858" text-anchor="start" font-size="18" font-weight="700" fill="#1F2A44">The disk pool fills before minRV moves</text>
<text x="14" y="886" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">Suppose instead that minRV is still 300 and no slot is free. The</text>
<text x="14" y="908" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">budget truncates the locally available history instead of growing:</text>
<circle cx="26" cy="935" r="12" fill="#1F2A44"/>
<text x="26" y="940" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">1</text>
<text x="48" y="940" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">select the page with the smallest boundary (P1, max 310)</text>
<circle cx="26" cy="966" r="12" fill="#E8731A"/>
<text x="26" y="971" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">2</text>
<text x="48" y="971" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">publish oldestAvailableRV = 310 for every shard that</text>
<text x="48" y="992" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">references it, before any block is discarded</text>
<circle cx="26" cy="1018" r="12" fill="#1F2A44"/>
<text x="26" y="1023" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">3</text>
<text x="48" y="1023" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">stop new readers below it; let pinned readers finish</text>
<circle cx="26" cy="1049" r="12" fill="#2E7D32"/>
<text x="26" y="1054" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">4</text>
<text x="48" y="1054" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">unlink and retire the page; its slots become reusable</text>
<rect x="14" y="1083" width="592" height="96" rx="7" fill="#F8F9FB" stroke="#C62828" stroke-width="1.5"/>
<text x="26" y="1109" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">minRV does not change. Reads below 310 on that shard now</text>
<text x="26" y="1130" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">return transaction_too_old; other shards are unaffected.</text>
<text x="26" y="1159" text-anchor="start" font-size="14" font-weight="700" fill="#C62828">Reclamation never advances minRV; capacity moves only a local boundary.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
