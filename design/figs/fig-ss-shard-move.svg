<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1054" viewBox="0 0 620 1054" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="620" height="1054" fill="#FFFFFF"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#1F2A44"/></marker><marker id="arrO" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#E8731A"/></marker><marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#C62828"/></marker><marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#2E7D32"/></marker><marker id="arrU" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#2F5EA8"/></marker><marker id="arrY" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#8A93A6"/></marker></defs>
<rect x="14" y="6" width="592" height="236" rx="8" fill="#F8F9FB" stroke="#1F2A44" stroke-width="1.5"/>
<text x="26" y="32" text-anchor="start" font-size="16.5" font-weight="700" fill="#1F2A44">Source Storage Server</text>
<text x="26" y="60" text-anchor="start" font-size="14.5" font-weight="700" fill="#1F2A44">current row</text>
<rect x="26" y="68" width="550" height="40" rx="5" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.5"/>
<text x="58.0" y="93.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A44">key k</text>
<rect x="91" y="69" width="328" height="38" rx="4" fill="#E3F1E4"/>
<line x1="90" y1="68" x2="90" y2="108" stroke="#8A93A6" stroke-width="0.9"/>
<text x="255.0" y="93.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D32">epoch 7 · page 42 · off 1,840 · len 212</text>
<line x1="420" y1="68" x2="420" y2="108" stroke="#8A93A6" stroke-width="0.9"/>
<text x="498.0" y="93.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A44">CV · value</text>
<text x="26" y="136" text-anchor="start" font-size="14.5" font-weight="700" fill="#1F2A44">placement table</text>
<rect x="26" y="144" width="568" height="36" rx="5" fill="#FDE6D3" stroke="#E8731A" stroke-width="1.5"/>
<line x1="126" y1="144" x2="126" y2="180" stroke="#8A93A6" stroke-width="0.9"/>
<text x="76" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#2E7D32">page 42</text>
<text x="140" y="168" text-anchor="start" font-size="15.5" font-weight="700" fill="#E8731A">local block vector: slots 5, 19</text>
<text x="26" y="210" text-anchor="start" font-size="14" font-weight="700" fill="#2E7D32">same logical identity</text>
<text x="26" y="228" text-anchor="start" font-size="14" font-weight="700" fill="#E8731A">placement is private to this server</text>
<line x1="54" y1="246" x2="54" y2="312" stroke="#1F2A44" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="76" y="272" text-anchor="start" font-size="14.5" font-weight="400" fill="#5B6578">current rows and logical history-page contents are copied unchanged;</text>
<text x="76" y="292" text-anchor="start" font-size="14.5" font-weight="400" fill="#5B6578">placement, physical block headers and checksums are rebuilt locally</text>
<rect x="14" y="316" width="592" height="236" rx="8" fill="#F8F9FB" stroke="#1F2A44" stroke-width="1.5"/>
<text x="26" y="342" text-anchor="start" font-size="16.5" font-weight="700" fill="#1F2A44">Destination Storage Server</text>
<text x="26" y="370" text-anchor="start" font-size="14.5" font-weight="700" fill="#1F2A44">current row</text>
<rect x="26" y="378" width="550" height="40" rx="5" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.5"/>
<text x="58.0" y="403.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A44">key k</text>
<rect x="91" y="379" width="328" height="38" rx="4" fill="#E3F1E4"/>
<line x1="90" y1="378" x2="90" y2="418" stroke="#8A93A6" stroke-width="0.9"/>
<text x="255.0" y="403.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D32">epoch 7 · page 42 · off 1,840 · len 212</text>
<line x1="420" y1="378" x2="420" y2="418" stroke="#8A93A6" stroke-width="0.9"/>
<text x="498.0" y="403.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A44">CV · value</text>
<text x="26" y="446" text-anchor="start" font-size="14.5" font-weight="700" fill="#1F2A44">placement table</text>
<rect x="26" y="454" width="568" height="36" rx="5" fill="#DCE6F5" stroke="#2F5EA8" stroke-width="1.5"/>
<line x1="126" y1="454" x2="126" y2="490" stroke="#8A93A6" stroke-width="0.9"/>
<text x="76" y="478" text-anchor="middle" font-size="15" font-weight="700" fill="#2E7D32">page 42</text>
<text x="140" y="478" text-anchor="start" font-size="15.5" font-weight="700" fill="#2F5EA8">local block vector: slots 230, 3</text>
<text x="26" y="520" text-anchor="start" font-size="14" font-weight="700" fill="#2E7D32">same logical identity</text>
<text x="26" y="538" text-anchor="start" font-size="14" font-weight="700" fill="#2F5EA8">placement is private to this server</text>
<text x="14" y="582" text-anchor="start" font-size="16.6" font-weight="400" fill="#5B6578">A row reference holds a logical page, an offset and a length; it never</text>
<text x="14" y="604" text-anchor="start" font-size="16.6" font-weight="400" fill="#5B6578">holds a slot. The destination installs its own placement table, so the</text>
<text x="14" y="626" text-anchor="start" font-size="16.6" font-weight="400" fill="#5B6578">same bytes resolve to its RAM pages or disk slots.</text>
<rect x="14" y="650" width="592" height="1" fill="#8A93A6"/>
<text x="14" y="686" text-anchor="start" font-size="18" font-weight="700" fill="#1F2A44">The handoff</text>
<circle cx="26" cy="711" r="12" fill="#1F2A44"/>
<text x="26" y="716" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">1</text>
<text x="48" y="716" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">at the transfer barrier the source detaches the shard's</text>
<text x="48" y="737" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">writable page and emits a transfer manifest</text>
<circle cx="26" cy="763" r="12" fill="#1F2A44"/>
<text x="26" y="768" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">2</text>
<text x="48" y="768" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">the destination copies and verifies rows, logical page contents</text>
<text x="48" y="789" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">and logical metadata, down to the transfer floor</text>
<circle cx="26" cy="815" r="12" fill="#1F2A44"/>
<text x="26" y="820" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">3</text>
<text x="48" y="820" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">it rebuilds placement and writes new block headers, then replays</text>
<text x="48" y="841" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">later mutations, continuing the same logical page sequence</text>
<circle cx="26" cy="867" r="12" fill="#2E7D32"/>
<text x="26" y="872" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">4</text>
<text x="48" y="872" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">routing changes only when every live reference resolves</text>
<text x="48" y="893" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">at the destination; the source pins the history until then</text>
<rect x="14" y="922" width="592" height="118" rx="7" fill="#F8F9FB" stroke="#E8731A" stroke-width="1.5"/>
<text x="26" y="948" text-anchor="start" font-size="16.5" font-weight="700" fill="#1F2A44">Not the same as a restart</text>
<text x="26" y="972" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">History is soft state. After a restart the pool is discarded, a new</text>
<text x="26" y="993" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">epoch starts, and references from the old epoch decode as null;</text>
<text x="26" y="1014" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6578">the shard serves from the recovered version onward.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
